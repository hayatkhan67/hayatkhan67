<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 420" width="1200" height="420" role="img" aria-label="Hayat Khan — Flutter &amp; Firebase Developer">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0B1120"/>
      <stop offset="0.55" stop-color="#0F172A"/>
      <stop offset="1" stop-color="#0A0F1C"/>
    </linearGradient>
    <linearGradient id="name" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#F8FAFC"/>
      <stop offset="1" stop-color="#CBD5E1"/>
    </linearGradient>
    <linearGradient id="role" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#38BDF8"/>
      <stop offset="0.5" stop-color="#818CF8"/>
      <stop offset="1" stop-color="#C084FC"/>
    </linearGradient>
    <linearGradient id="phoneEdge" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#38BDF8"/>
      <stop offset="1" stop-color="#8B5CF6"/>
    </linearGradient>
    <linearGradient id="shimmer" x1="-1" y1="0" x2="0" y2="0">
      <stop offset="0" stop-color="#1E293B"/>
      <stop offset="0.5" stop-color="#334155"/>
      <stop offset="1" stop-color="#1E293B"/>
      <animate attributeName="x1" values="-1;1" dur="1.8s" repeatCount="indefinite"/>
      <animate attributeName="x2" values="0;2" dur="1.8s" repeatCount="indefinite"/>
    </linearGradient>
    <radialGradient id="blobBlue">
      <stop offset="0" stop-color="#38BDF8" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#38BDF8" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="blobPurple">
      <stop offset="0" stop-color="#8B5CF6" stop-opacity="0.32"/>
      <stop offset="1" stop-color="#8B5CF6" stop-opacity="0"/>
    </radialGradient>
    <pattern id="dots" width="24" height="24" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1" fill="#94A3B8" opacity="0.18"/>
    </pattern>
    <clipPath id="frame"><rect width="1200" height="420" rx="20"/></clipPath>
    <clipPath id="screen"><rect x="872" y="42" width="176" height="336" rx="26"/></clipPath>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="12" stdDeviation="14" flood-color="#000" flood-opacity="0.45"/>
    </filter>
  </defs>

  <g clip-path="url(#frame)">
    <rect width="1200" height="420" fill="url(#bg)"/>
    <rect width="1200" height="420" fill="url(#dots)"/>

    <circle cx="960" cy="120" r="260" fill="url(#blobBlue)">
      <animate attributeName="cx" values="960;1010;960" dur="12s" repeatCount="indefinite"/>
    </circle>
    <circle cx="760" cy="380" r="240" fill="url(#blobPurple)">
      <animate attributeName="cy" values="380;330;380" dur="14s" repeatCount="indefinite"/>
    </circle>
    <circle cx="80" cy="40" r="200" fill="url(#blobBlue)" opacity="0.6"/>

    <g font-family="-apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
      <!-- availability pill -->
      <g transform="translate(70 62)">
        <rect width="300" height="32" rx="16" fill="#052E1B" stroke="#22C55E" stroke-opacity="0.55"/>
        <circle cx="20" cy="16" r="9" fill="#22C55E" opacity="0.3">
          <animate attributeName="r" values="5;10;5" dur="2s" repeatCount="indefinite"/>
          <animate attributeName="opacity" values="0.5;0;0.5" dur="2s" repeatCount="indefinite"/>
        </circle>
        <circle cx="20" cy="16" r="5" fill="#22C55E"/>
        <text x="36" y="21" fill="#86EFAC" font-size="12.5" font-weight="700" letter-spacing="1.2">AVAILABLE FOR FREELANCE &amp; HIRE</text>
      </g>

      <text x="66" y="168" fill="url(#name)" font-size="68" font-weight="800" letter-spacing="-1.5">Hayat Khan</text>
      <text x="70" y="214" fill="url(#role)" font-size="28" font-weight="700">Flutter &amp; Firebase Developer</text>

      <text fill="#94A3B8" font-size="17.5">
        <tspan x="70" y="256">I design, build and ship cross-platform apps with clean,</tspan>
        <tspan x="70" y="282">scalable architecture — from idea to App Store &amp; Play Store.</tspan>
      </text>

      <!-- skill chips -->
      <g transform="translate(70 308)" font-size="13" font-weight="600">
        <rect width="78" height="32" rx="9" fill="#0C2A3F" stroke="#38BDF8" stroke-opacity="0.45"/>
        <text x="39" y="21" fill="#7DD3FC" text-anchor="middle">Flutter</text>
        <rect x="88" width="60" height="32" rx="9" fill="#0C2A3F" stroke="#38BDF8" stroke-opacity="0.45"/>
        <text x="118" y="21" fill="#7DD3FC" text-anchor="middle">Dart</text>
        <rect x="158" width="88" height="32" rx="9" fill="#3A1A08" stroke="#F97316" stroke-opacity="0.5"/>
        <text x="202" y="21" fill="#FDBA74" text-anchor="middle">Firebase</text>
        <rect x="256" width="156" height="32" rx="9" fill="#221A45" stroke="#A78BFA" stroke-opacity="0.5"/>
        <text x="334" y="21" fill="#C4B5FD" text-anchor="middle">Clean Architecture</text>
        <rect x="422" width="96" height="32" rx="9" fill="#0F2E25" stroke="#34D399" stroke-opacity="0.5"/>
        <text x="470" y="21" fill="#6EE7B7" text-anchor="middle">REST APIs</text>
      </g>

      <!-- footer meta -->
      <g transform="translate(70 376)" font-size="14" font-weight="600" fill="#CBD5E1">
        <circle cx="6" cy="-5" r="6" fill="none" stroke="#38BDF8" stroke-width="1.6"/>
        <path d="M0 -5h12M6 -11c-3 3-3 9 0 12M6 -11c3 3 3 9 0 12" fill="none" stroke="#38BDF8" stroke-width="1.2"/>
        <text x="20" y="0">hayatkhan.tech</text>
        <text x="148" y="0" fill="#475569">•</text>
        <path d="M172.5 -13l6.5 3.5v7l-6.5 3.5-6.5-3.5v-7zM166 -9.5l6.5 3.5 6.5-3.5M172.5 -6v7.5" fill="none" stroke="#818CF8" stroke-width="1.5" stroke-linejoin="round"/>
        <text x="186" y="0">Open-source packages on pub.dev</text>
      </g>
    </g>

    <!-- phone mockup -->
    <g filter="url(#shadow)">
      <rect x="860" y="30" width="200" height="360" rx="36" fill="#020617" stroke="url(#phoneEdge)" stroke-width="2.5"/>
    </g>
    <g clip-path="url(#screen)" font-family="-apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
      <rect x="872" y="42" width="176" height="336" fill="#0F172A"/>
      <rect x="932" y="50" width="56" height="14" rx="7" fill="#020617"/>
      <text x="888" y="94" fill="#F1F5F9" font-size="15" font-weight="700">Discover</text>
      <circle cx="1028" cy="89" r="9" fill="url(#role)"/>

      <rect x="886" y="108" width="148" height="62" rx="12" fill="url(#role)" opacity="0.9"/>
      <text x="898" y="133" fill="#0B1120" font-size="12" font-weight="800">Built with Flutter</text>
      <rect x="898" y="144" width="70" height="8" rx="4" fill="#0B1120" opacity="0.35"/>

      <g fill="url(#shimmer)">
        <circle cx="902" cy="198" r="14"/>
        <rect x="924" y="188" width="104" height="9" rx="4.5"/>
        <rect x="924" y="203" width="70" height="8" rx="4"/>
        <circle cx="902" cy="244" r="14"/>
        <rect x="924" y="234" width="96" height="9" rx="4.5"/>
        <rect x="924" y="249" width="80" height="8" rx="4"/>
        <circle cx="902" cy="290" r="14"/>
        <rect x="924" y="280" width="108" height="9" rx="4.5"/>
        <rect x="924" y="295" width="60" height="8" rx="4"/>
        <circle cx="902" cy="336" r="14"/>
        <rect x="924" y="326" width="90" height="9" rx="4.5"/>
        <rect x="924" y="341" width="74" height="8" rx="4"/>
      </g>
      <rect x="922" y="364" width="76" height="4" rx="2" fill="#475569"/>
    </g>

    <!-- floating card: pub.dev -->
    <g font-family="-apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
      <g>
        <animateTransform attributeName="transform" type="translate" values="0 0;0 -7;0 0" dur="5s" repeatCount="indefinite"/>
        <g transform="translate(-48 0)">
        <g filter="url(#shadow)">
          <rect x="736" y="96" width="168" height="58" rx="14" fill="#111827" stroke="#334155"/>
        </g>
        <rect x="748" y="108" width="34" height="34" rx="9" fill="#0C2A3F"/>
        <path d="M758 118l7 7-7 7M767 132h8" fill="none" stroke="#38BDF8" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
        <text x="792" y="122" fill="#94A3B8" font-size="11" font-weight="600">pub.dev</text>
        <text x="792" y="140" fill="#F1F5F9" font-size="14" font-weight="700">pagy</text>
        <rect x="834" y="128" width="56" height="16" rx="8" fill="#052E1B"/>
        <text x="862" y="140" fill="#86EFAC" font-size="10" font-weight="700" text-anchor="middle">published</text>
      </g>
      </g>

      <!-- floating card: firebase -->
      <g>
        <animateTransform attributeName="transform" type="translate" values="0 0;0 8;0 0" dur="6s" repeatCount="indefinite"/>
        <g filter="url(#shadow)">
          <rect x="1018" y="282" width="152" height="54" rx="14" fill="#111827" stroke="#334155"/>
        </g>
        <path d="M1034 322l6-30 6 12 4-8 8 26z" fill="#F59E0B"/>
        <path d="M1034 322l12-18 12 18z" fill="#F97316"/>
        <text x="1068" y="303" fill="#94A3B8" font-size="11" font-weight="600">Firebase</text>
        <text x="1068" y="321" fill="#F1F5F9" font-size="13" font-weight="700">Synced ✓</text>
      </g>

      <!-- flutter logo badge -->
      <g>
        <animateTransform attributeName="transform" type="translate" values="0 0;0 -5;0 0" dur="4s" repeatCount="indefinite"/>
        <g filter="url(#shadow)">
          <circle cx="1080" cy="72" r="32" fill="#F8FAFC"/>
        </g>
        <g transform="translate(1064 52) scale(0.2)">
          <path d="M37.7 128.9 9.8 101 100.4 10.4h55.8z" fill="#54C5F8"/>
          <path d="M156.2 93.2h-55.8l-20.9 20.9 27.9 27.9z" fill="#54C5F8"/>
          <path d="M79.5 170.7l20.9 20.9h55.8l-48.8-48.8z" fill="#01579B"/>
          <path d="M51.6 142.4l27.9-27.9 27.9 27.9-27.9 27.9z" fill="#29B6F6"/>
        </g>
      </g>
    </g>
  </g>
  <rect x="0.5" y="0.5" width="1199" height="419" rx="20" fill="none" stroke="#1E293B"/>
</svg>

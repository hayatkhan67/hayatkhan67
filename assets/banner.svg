<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 850 300" width="850" height="300">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0e17" />
      <stop offset="50%" stop-color="#101524" />
      <stop offset="100%" stop-color="#070a0f" />
    </linearGradient>

    <!-- Text Gradient -->
    <linearGradient id="text-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#818cf8" />
      <stop offset="100%" stop-color="#c084fc" />
    </linearGradient>

    <!-- Subtitle Gradient -->
    <linearGradient id="sub-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#06b6d4" />
      <stop offset="100%" stop-color="#3b82f6" />
    </linearGradient>

    <!-- Glow Filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <filter id="subtle-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background -->
  <rect width="850" height="300" fill="url(#bg-grad)" rx="15" />

  <!-- Background Decorative Grid Pattern -->
  <g opacity="0.08">
    <path d="M 0,30 L 850,30 M 0,60 L 850,60 M 0,90 L 850,90 M 0,120 L 850,120 M 0,150 L 850,150 M 0,180 L 850,180 M 0,210 L 850,210 M 0,240 L 850,240 M 0,270 L 850,270" stroke="#ffffff" stroke-width="1" />
    <path d="M 50,0 L 50,300 M 100,0 L 100,300 M 150,0 L 150,300 M 200,0 L 200,300 M 250,0 L 250,300 M 300,0 L 300,300 M 350,0 L 350,300 M 400,0 L 400,300 M 450,0 L 450,300 M 500,0 L 500,300 M 550,0 L 550,300 M 600,0 L 600,300 M 650,0 L 650,300 M 700,0 L 700,300 M 750,0 L 750,300 M 800,0 L 800,300" stroke="#ffffff" stroke-width="1" />
  </g>

  <!-- Decorative Glowing Shapes/Waves in Background -->
  <circle cx="750" cy="80" r="100" fill="#3b82f6" opacity="0.12" filter="url(#glow)" />
  <circle cx="100" cy="220" r="80" fill="#a855f7" opacity="0.1" filter="url(#glow)" />

  <!-- Technical Circuit Lines -->
  <g stroke="url(#text-grad)" stroke-width="1.5" opacity="0.3" fill="none">
    <path d="M 50,50 L 120,50 L 150,80 L 200,80" />
    <circle cx="200" cy="80" r="3" fill="#38bdf8" />
    
    <path d="M 800,250 L 730,250 L 700,220 L 620,220" />
    <circle cx="620" cy="220" r="3" fill="#c084fc" />

    <path d="M 750,150 L 780,180 L 820,180" />
    <circle cx="820" cy="180" r="3" fill="#818cf8" />
  </g>

  <!-- Center Content -->
  <g transform="translate(80, 0)">
    <!-- Welcome/Introduction tag -->
    <rect x="0" y="70" width="105" height="26" rx="13" fill="#1e293b" stroke="#334155" stroke-width="1" />
    <text x="52.5" y="83" fill="#38bdf8" font-family="'Segoe UI', Roboto, Helvetica, sans-serif" font-size="12" font-weight="bold" letter-spacing="1" text-anchor="middle" dominant-baseline="central">PORTFOLIO</text>

    <!-- Main Title -->
    <text x="0" y="145" fill="url(#text-grad)" font-family="'Segoe UI', Roboto, Helvetica, sans-serif" font-size="44" font-weight="900" letter-spacing="1.5" filter="url(#subtle-glow)">HAYAT KHAN</text>

    <!-- Subtitle -->
    <text x="0" y="185" fill="#f8fafc" font-family="'Segoe UI', Roboto, Helvetica, sans-serif" font-size="20" font-weight="600" letter-spacing="0.5">Flutter &amp; Frontend Developer</text>
    
    <!-- Short Info -->
    <text x="0" y="215" fill="#94a3b8" font-family="'Segoe UI', Roboto, Helvetica, sans-serif" font-size="14" font-weight="400" letter-spacing="0.2">Building high-performance mobile, web, and custom UI experiences.</text>

    <!-- Animated Tech Badges (Design representation in SVG) -->
    <g transform="translate(0, 240)">
      <!-- Dart Tag -->
      <rect x="0" y="0" width="65" height="24" rx="6" fill="#0f172a" stroke="#0284c7" stroke-width="1" />
      <text x="32.5" y="12" fill="#38bdf8" font-family="'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="bold" text-anchor="middle" dominant-baseline="central">Dart</text>

      <!-- Flutter Tag -->
      <rect x="75" y="0" width="75" height="24" rx="6" fill="#0f172a" stroke="#0284c7" stroke-width="1" />
      <text x="112.5" y="12" fill="#38bdf8" font-family="'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="bold" text-anchor="middle" dominant-baseline="central">Flutter</text>

      <!-- Firebase Tag -->
      <rect x="160" y="0" width="85" height="24" rx="6" fill="#0f172a" stroke="#ea580c" stroke-width="1" />
      <text x="202.5" y="12" fill="#f97316" font-family="'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="bold" text-anchor="middle" dominant-baseline="central">Firebase</text>

      <!-- UI/UX Tag -->
      <rect x="255" y="0" width="70" height="24" rx="6" fill="#0f172a" stroke="#84cc16" stroke-width="1" />
      <text x="290" y="12" fill="#a3e635" font-family="'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="bold" text-anchor="middle" dominant-baseline="central">UI/UX</text>
    </g>
  </g>

  <!-- Glowing Right Graphic (Abstract Mobile/Code structure) -->
  <g transform="translate(680, 150)" filter="url(#glow)">
    <!-- Outer phone frame -->
    <rect x="-35" y="-60" width="70" height="120" rx="10" fill="none" stroke="#818cf8" stroke-width="2" opacity="0.7" />
    <!-- Inner screen features -->
    <line x1="-25" y1="-40" x2="25" y2="-40" stroke="#38bdf8" stroke-width="2" opacity="0.6" />
    <rect x="-25" y="-30" width="50" height="50" rx="4" fill="#1e293b" stroke="#818cf8" stroke-width="1" opacity="0.5" />
    <circle cx="0" cy="-5" r="10" fill="url(#text-grad)" opacity="0.8" />
    <!-- Floating particles around -->
    <circle cx="-50" cy="-30" r="3" fill="#c084fc" opacity="0.9" />
    <circle cx="55" cy="20" r="4" fill="#38bdf8" opacity="0.8" />
    <circle cx="-45" cy="40" r="2" fill="#818cf8" opacity="0.7" />
    <circle cx="45" cy="-50" r="3" fill="#ea580c" opacity="0.8" />
  </g>
</svg>
